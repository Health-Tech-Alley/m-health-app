plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.litertembedder'
version = '1.0.0'

android {
  namespace "expo.modules.litertembedder"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.ai.edge.litert:litert:1.4.0"
}
